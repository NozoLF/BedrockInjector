
name: Build Windows Injector

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload EXE and DLL
        uses: actions/upload-artifact@v4
        with:
          name: BedrockInjector-Windows
          path: |
            build/Release/Injector.exe
            build/Release/ClientTest.dll
          if-no-files-found: error
